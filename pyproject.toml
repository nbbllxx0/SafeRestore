[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saferestore"
version = "0.2.0"
description = "Detector-relative risk certificates for selective industrial image restoration"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.1.3", "scipy==1.15.1"]

[project.optional-dependencies]
research = [
  "matplotlib==3.10.8",
  "pillow==12.3.0",
  "scikit-learn==1.9.0",
  "torch==2.11.0",
  "torchvision==0.26.0",
]
dev = ["pytest==7.4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]
